<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ 録音中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Geist','Noto Sans JP',sans-serif; overflow: hidden">

<header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: {{c.surface}}; border-bottom: 1px solid {{c.line}}">
<a href="#" style="height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px; font-size: 15px; color: {{c.ink}}; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>会議</a>
<span style="flex-grow: 1"></span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; margin-right: 12px; padding: 0 10px; background: {{c.recSoft}}; border-radius: 999px; font-size: 13px; font-weight: 500; color: {{c.rec}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.rec}}"></span>録音中 <span style="font-family: 'Geist Mono',monospace">12:34</span></span>
</header>

<section style="padding: 20px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; background: {{c.surface}}; border-bottom: 1px solid {{c.line}}">
<h1 style="margin: 0; align-self: stretch; font-size: 20px; font-weight: 600">週次 1on1</h1>
<div aria-hidden="true" style="width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; gap: 3px">
<span style="width: 3px; height: 12px; background: {{c.line2}}; border-radius: 2px"></span><span style="width: 3px; height: 20px; background: {{c.line2}}; border-radius: 2px"></span><span style="width: 3px; height: 32px; background: {{c.muted}}; border-radius: 2px"></span><span style="width: 3px; height: 44px; background: {{c.ink}}; border-radius: 2px"></span><span style="width: 3px; height: 28px; background: {{c.ink}}; border-radius: 2px"></span><span style="width: 3px; height: 50px; background: {{c.ink}}; border-radius: 2px"></span><span style="width: 3px; height: 36px; background: {{c.ink}}; border-radius: 2px"></span><span style="width: 3px; height: 22px; background: {{c.muted}}; border-radius: 2px"></span><span style="width: 3px; height: 40px; background: {{c.ink}}; border-radius: 2px"></span><span style="width: 3px; height: 26px; background: {{c.muted}}; border-radius: 2px"></span><span style="width: 3px; height: 16px; background: {{c.line2}}; border-radius: 2px"></span><span style="width: 3px; height: 10px; background: {{c.line2}}; border-radius: 2px"></span>
</div>
<span style="font-family: 'Geist Mono',monospace; font-size: 36px; font-weight: 500; letter-spacing: -0.02em">12:34</span>
<div role="toolbar" aria-label="録音操作" style="display: flex; align-items: flex-start; justify-content: center; gap: 36px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><button type="button" aria-pressed="false" aria-label="マイクをミュート" style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: {{c.sub}}; border: 0; border-radius: 50%; color: {{c.ink}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3"></path></svg></button><span style="font-size: 12px; color: {{c.muted}}">ミュート</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><button type="button" aria-label="録音を終了して確定" style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: {{c.rec}}; border: 0; border-radius: 50%"><span style="width: 20px; height: 20px; background: {{c.onRec}}; border-radius: 4px"></span></button><span style="font-size: 12px; color: {{c.muted}}">終了して確定</span></div>
</div>
</section>

<nav role="tablist" aria-label="会議中の表示" style="flex-shrink: 0; display: flex; gap: 20px; padding: 0 16px; background: {{c.surface}}; border-bottom: 1px solid {{c.line}}">
<button type="button" role="tab" aria-selected="true" style="height: 46px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid {{c.ink}}; font: inherit; font-size: 14px; font-weight: 500; color: {{c.ink}}">文字起こし</button>
<button type="button" role="tab" aria-selected="false" style="height: 46px; padding: 0; background: transparent; border: 0; font: inherit; font-size: 14px; font-weight: 500; color: {{c.muted}}">リアルタイム解析</button>
<button type="button" role="tab" aria-selected="false" style="height: 46px; padding: 0; background: transparent; border: 0; font: inherit; font-size: 14px; font-weight: 500; color: {{c.muted}}">回答支援</button>
</nav>
<div role="tabpanel" style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
<article style="display: flex; flex-direction: column; gap: 3px; padding: 10px 8px"><span style="display: flex; gap: 8px; font-size: 12px"><span style="font-family: 'Geist Mono',monospace; color: {{c.muted}}">11:58</span><span style="font-weight: 500; color: {{c.text3}}">[話者 1]</span></span><span style="font-size: 15px; line-height: 1.7; color: {{c.text2}}">[確定した発話]</span></article>
<article style="display: flex; flex-direction: column; gap: 3px; padding: 10px 8px"><span style="display: flex; gap: 8px; font-size: 12px"><span style="font-family: 'Geist Mono',monospace; color: {{c.muted}}">12:20</span><span style="font-weight: 500; color: {{c.text3}}">[話者 2]</span></span><span style="font-size: 15px; line-height: 1.7; color: {{c.text2}}">[確定した発話]</span></article>
<article style="display: flex; flex-direction: column; gap: 3px; padding: 10px 8px; background: {{c.sub}}; border-radius: 8px"><span style="display: flex; gap: 8px; font-size: 12px"><span style="font-family: 'Geist Mono',monospace; color: {{c.accent}}">12:31</span><span style="font-weight: 500; color: {{c.text3}}">[話者 1]</span></span><span style="font-size: 15px; line-height: 1.7; color: {{c.muted}}">[認識中の発話…]</span></article>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var dark = !!this.props.dark;
var L = { bg: '#FAFAFA', surface: '#FFFFFF', sub: '#F4F4F5', line: '#E4E4E7', line2: '#D4D4D8', ink: '#09090B', text2: '#3F3F46', text3: '#52525B', muted: '#6B6B73', accent: '#047857', rec: '#B42318', recSoft: '#FEF2F2', onRec: '#FFFFFF' };
var D = { bg: '#09090B', surface: '#111113', sub: '#1C1C1F', line: '#27272A', line2: '#3F3F46', ink: '#FAFAFA', text2: '#D4D4D8', text3: '#B4B4BC', muted: '#A1A1AA', accent: '#6EE7B7', rec: '#F87171', recSoft: '#2A1215', onRec: '#09090B' };
return { c: dark ? D : L };
}
}
</script>
</body>
</html>
