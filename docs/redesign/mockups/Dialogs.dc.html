<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ダイアログとエラー画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 1440px; height: 820px; box-sizing: border-box; padding: 64px 56px; display: grid; grid-template-columns: 480px 420px minmax(0, 1fr); gap: 40px; align-items: start; background: {{c.scrimBg}}; color: {{c.ink}}; font-family: 'Geist','Noto Sans JP',sans-serif; overflow: hidden">

<section role="dialog" aria-labelledby="rg-title" style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 16px; box-shadow: 0 24px 64px {{c.shadow}}; overflow: hidden">
<header style="padding: 20px 24px 6px"><h2 id="rg-title" style="margin: 0; font-size: 18px; font-weight: 600">要約を再生成</h2><p style="margin: 6px 0 0; font-size: 13px; color: {{c.muted}}">今回の生成に使う設定を選びます。会議の設定は変わりません。</p></header>
<div style="padding: 16px 24px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">AIプロファイル</span><button type="button" style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; font: inherit; font-size: 14px; color: {{c.ink}}; cursor: pointer">会議のAI設定を使用<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">議事録テンプレート</span><button type="button" style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; font: inherit; font-size: 14px; color: {{c.ink}}; cursor: pointer">会議で使用した設定 · [テンプレート名] · v2<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<div style="display: flex; gap: 10px; padding: 12px 14px; background: {{c.sub}}; border-radius: 10px; font-size: 13px; line-height: 1.6; color: {{c.text2}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span>保存済みの全体文字起こしを使い、要約だけを生成します。処理中も今の議事録を閲覧できます。</span></div>
</div>
<footer style="display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px; background: {{c.bg}}; border-top: 1px solid {{c.line}}">
<button type="button" style="height: 36px; padding: 0 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; font: inherit; font-size: 14px; color: {{c.ink}}; cursor: pointer">キャンセル</button>
<button type="submit" style="height: 36px; padding: 0 14px; background: {{c.primary}}; border: 0; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; color: {{c.onPrimary}}; cursor: pointer">再生成を開始</button>
</footer>
</section>

<section role="dialog" aria-labelledby="tg-title" style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 16px; box-shadow: 0 24px 64px {{c.shadow}}; overflow: hidden">
<header style="display: flex; align-items: center; padding: 20px 24px 12px"><h2 id="tg-title" style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">タグを管理</h2><button type="button" aria-label="閉じる" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: {{c.muted}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></header>
<form style="display: flex; gap: 8px; padding: 0 24px 16px"><input type="text" aria-label="新しいタグ" placeholder="例：採用、プロジェクトA" style="flex-grow: 1; height: 38px; box-sizing: border-box; padding: 0 12px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; font: inherit; font-size: 14px; color: {{c.ink}}; outline: 0"><button type="submit" style="height: 38px; padding: 0 14px; background: {{c.primary}}; border: 0; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; color: {{c.onPrimary}}; cursor: pointer">作成</button></form>
<div style="border-top: 1px solid {{c.line}}">
<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px; border-bottom: 1px solid {{c.lineSoft}}"><span style="font-size: 14px; flex-grow: 1"># 定例</span><span style="font-size: 12px; color: {{c.muted}}">8件の会議</span><button type="button" aria-label="定例タグを削除" style="padding: 0; background: transparent; border: 0; font: inherit; font-size: 13px; color: {{c.err}}; cursor: pointer">削除</button></div>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px; border-bottom: 1px solid {{c.lineSoft}}"><span style="font-size: 14px; flex-grow: 1"># プロジェクトA</span><span style="font-size: 12px; color: {{c.muted}}">6件の会議</span><button type="button" aria-label="プロジェクトAタグを削除" style="padding: 0; background: transparent; border: 0; font: inherit; font-size: 13px; color: {{c.err}}; cursor: pointer">削除</button></div>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px; border-bottom: 1px solid {{c.lineSoft}}"><span style="font-size: 14px; flex-grow: 1"># 営業</span><span style="font-size: 12px; color: {{c.muted}}">4件の会議</span><button type="button" aria-label="営業タグを削除" style="padding: 0; background: transparent; border: 0; font: inherit; font-size: 13px; color: {{c.err}}; cursor: pointer">削除</button></div>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px"><span style="font-size: 14px; flex-grow: 1"># 採用</span><span style="font-size: 12px; color: {{c.muted}}">3件の会議</span><button type="button" aria-label="採用タグを削除" style="padding: 0; background: transparent; border: 0; font: inherit; font-size: 13px; color: {{c.err}}; cursor: pointer">削除</button></div>
</div>
</section>

<section style="height: 560px; display: flex; align-items: center; justify-content: center; background: {{c.bg}}; border: 1px solid {{c.line}}; border-radius: 16px">
<div style="width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="font-family: 'Geist Mono',monospace; font-size: 13px; color: {{c.muted}}">404</span>
<h2 style="margin: 0; font-size: 22px; font-weight: 600">ページが見つかりません</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: {{c.text2}}">ページが移動したか、会議が削除された可能性があります。ホームからもう一度開いてください。</p>
<a href="#" style="margin-top: 8px; height: 38px; display: flex; align-items: center; padding: 0 16px; background: {{c.primary}}; border-radius: 8px; font-size: 14px; font-weight: 500; color: {{c.onPrimary}}; text-decoration: none">ホームへ戻る</a>
<span style="font-size: 12px; color: {{c.muted}}">エラー画面・取得失敗画面も同じ構成（再試行ボタンを追加）</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
renderVals() {
var dark = !!this.props.dark;
var L = { scrimBg: '#E4E4E7', bg: '#FAFAFA', surface: '#FFFFFF', sub: '#F4F4F5', line: '#E4E4E7', lineSoft: '#F1F1F3', ink: '#09090B', text2: '#3F3F46', muted: '#6B6B73', primary: '#09090B', onPrimary: '#FFFFFF', err: '#B42318', shadow: 'rgba(9,9,11,0.14)' };
var D = { scrimBg: '#050506', bg: '#09090B', surface: '#111113', sub: '#1C1C1F', line: '#27272A', lineSoft: '#1F1F22', ink: '#FAFAFA', text2: '#D4D4D8', muted: '#A1A1AA', primary: '#FAFAFA', onPrimary: '#09090B', err: '#F87171', shadow: 'rgba(0,0,0,0.6)' };
return { c: dark ? D : L };
}
}
</script>
</body>
</html>
