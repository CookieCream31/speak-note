<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Geist','Noto Sans JP',sans-serif; overflow: hidden">

<header style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 14px; background: {{c.bg}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; gap: 2px; background: {{c.primary}}; border-radius: 7px"><span style="width: 2.5px; height: 6px; background: {{c.onPrimary}}; border-radius: 2px"></span><span style="width: 2.5px; height: 13px; background: {{c.onPrimary}}; border-radius: 2px"></span><span style="width: 2.5px; height: 9px; background: {{c.onPrimary}}; border-radius: 2px"></span></span>
<h1 style="margin: 0; flex-grow: 1; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">会議</h1>
<button type="button" aria-label="表示テーマ" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 10px; color: {{c.text2}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></button>
</div>
<label style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: {{c.sub}}; border-radius: 10px; color: {{c.muted}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="会議を検索" aria-label="会議を検索" style="flex-grow: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: {{c.ink}}"></label>
<div role="group" aria-label="絞り込み" style="display: flex; gap: 6px; overflow: hidden; margin-right: -16px">
<button type="button" aria-pressed="true" style="flex-shrink: 0; height: 34px; padding: 0 14px; background: {{c.primary}}; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 500; color: {{c.onPrimary}}">すべて</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 34px; padding: 0 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 999px; font: inherit; font-size: 13px; color: {{c.text2}}">お気に入り</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 34px; padding: 0 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 999px; font: inherit; font-size: 13px; color: {{c.text2}}"># 定例</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 34px; padding: 0 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 999px; font: inherit; font-size: 13px; color: {{c.text2}}"># プロジェクトA</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 34px; padding: 0 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 999px; font: inherit; font-size: 13px; color: {{c.text2}}"># 営業</button>
</div>
</header>

<main style="flex-grow: 1; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px">
<section aria-label="処理中・要確認" style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 12px; overflow: hidden">
<a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid {{c.lineSoft}}; color: {{c.ink}}; text-decoration: none"><span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: {{c.accent}}"></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">採用面接 — バックエンドエンジニア</span><span style="font-size: 12px; color: {{c.accent}}">AI解析中</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
<a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; color: {{c.ink}}; text-decoration: none"><span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: {{c.err}}"></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500">週次 1on1</span><span style="font-size: 12px; color: {{c.err}}">失敗 · 開いて再試行</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
</section>

<div style="display: flex; flex-direction: column">
<span style="padding: 4px 2px 6px; font-size: 12px; font-weight: 500; color: {{c.muted}}">今週</span>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 2px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none"><span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.sub}}; border-radius: 10px; color: {{c.text2}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></span><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">プロダクト定例<svg width="12" height="12" viewBox="0 0 24 24" fill="{{c.ink}}" aria-label="お気に入り" role="img"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"></path></svg></span><span style="font-size: 12px; color: {{c.muted}}">9月29日 10:00 · <span style="font-family: 'Geist Mono',monospace">48:12</span> · # プロジェクトA</span></span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 2px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none"><span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.sub}}; border-radius: 10px; color: {{c.text2}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">採用面接 — バックエンドエンジニア</span><span style="font-size: 12px; color: {{c.muted}}">9月28日 15:30 · <span style="font-family: 'Geist Mono',monospace">1:02:45</span> · <span style="color: {{c.accent}}">AI解析中</span></span></span></a>
<span style="padding: 16px 2px 6px; font-size: 12px; font-weight: 500; color: {{c.muted}}">先週</span>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 2px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none"><span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.sub}}; border-radius: 10px; color: {{c.text2}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"></rect><path d="m16 10 5-3v10l-5-3"></path></svg></span><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500">顧客ヒアリング</span><span style="font-size: 12px; color: {{c.muted}}">9月26日 13:00 · <span style="font-family: 'Geist Mono',monospace">35:08</span> · # 営業</span></span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 2px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none"><span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.sub}}; border-radius: 10px; color: {{c.text2}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></span><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500">週次 1on1</span><span style="font-size: 12px; color: {{c.muted}}">9月25日 18:00 · <span style="font-family: 'Geist Mono',monospace">28:40</span> · <span style="color: {{c.err}}">失敗</span></span></span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 2px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none"><span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.sub}}; border-radius: 10px; color: {{c.text2}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></span><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">設計レビュー：通知基盤<svg width="12" height="12" viewBox="0 0 24 24" fill="{{c.ink}}" aria-label="お気に入り" role="img"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"></path></svg></span><span style="font-size: 12px; color: {{c.muted}}">9月24日 11:00 · <span style="font-family: 'Geist Mono',monospace">55:21</span> · # プロジェクトA</span></span></a>
</div>
</main>

<button type="button" aria-label="新しい会議" style="position: absolute; right: 16px; bottom: 96px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: {{c.primary}}; border: 0; border-radius: 16px; box-shadow: 0 8px 24px {{c.shadow}}; color: {{c.onPrimary}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>

<nav aria-label="メインナビゲーション" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding: 8px 12px 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: {{c.surface}}; border-top: 1px solid {{c.line}}">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{c.ink}}; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>会議</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{c.muted}}; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>プロジェクト</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{c.muted}}; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"></path></svg>AI設定</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
var dark = !!this.props.dark;
var L = { bg: '#FAFAFA', surface: '#FFFFFF', sub: '#F4F4F5', line: '#E4E4E7', lineSoft: '#F1F1F3', ink: '#09090B', text2: '#3F3F46', muted: '#6B6B73', primary: '#09090B', onPrimary: '#FFFFFF', accent: '#047857', err: '#B42318', shadow: 'rgba(9,9,11,0.22)' };
var D = { bg: '#09090B', surface: '#111113', sub: '#1C1C1F', line: '#27272A', lineSoft: '#1F1F22', ink: '#FAFAFA', text2: '#D4D4D8', muted: '#A1A1AA', primary: '#FAFAFA', onPrimary: '#09090B', accent: '#6EE7B7', err: '#F87171', shadow: 'rgba(0,0,0,0.6)' };

}
}
</script>
</body>
</html>
