<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ 新しい会議</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; background: {{c.scrim}}; color: {{c.ink}}; font-family: 'Geist','Noto Sans JP',sans-serif; overflow: hidden">
<section role="dialog" aria-modal="true" aria-labelledby="mnm-title" style="background: {{c.surface}}; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="width: 36px; height: 5px; margin: 8px auto 0; background: {{c.line2}}; border-radius: 3px"></span>
<header style="display: flex; align-items: center; padding: 10px 8px 6px 20px"><h2 id="mnm-title" style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">新しい会議</h2><button type="button" aria-label="閉じる" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: {{c.muted}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></header>
<div style="padding: 6px 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div role="radiogroup" aria-label="取り込み方法" style="display: flex; flex-direction: column; border: 1px solid {{c.line}}; border-radius: 12px; overflow: hidden">
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; background: {{c.sub}}; border: 0; border-bottom: 1px solid {{c.line}}; text-align: left; font: inherit; color: {{c.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg><span style="flex-grow: 1; font-size: 15px; font-weight: 500">音声・動画ファイル</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid {{c.line}}; text-align: left; font: inherit; color: {{c.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px">画面共有を録画</span><span style="font-size: 12px; color: {{c.muted}}">非対応の端末では画面収録ファイルをアップロード</span></span></button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; background: transparent; border: 0; text-align: left; font: inherit; color: {{c.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg><span style="flex-grow: 1; font-size: 15px">マイク音声を録音</span></button>
</div>
<label style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; background: {{c.bg}}; border: 1.5px dashed {{c.line2}}; border-radius: 12px; font-size: 15px; font-weight: 500; color: {{c.ink}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg>ファイルを選択<input type="file" aria-label="音声・動画ファイル" style="width: 1px; height: 1px; opacity: 0"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">会議タイトル<input type="text" placeholder="例：プロダクト定例" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; color: {{c.ink}}; outline: 0"></label>
<div style="display: flex; flex-direction: column; border: 1px solid {{c.line}}; border-radius: 12px; overflow: hidden">
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid {{c.line}}; font: inherit; color: {{c.ink}}"><span style="flex-grow: 1; text-align: left; font-size: 15px">プロジェクト</span><span style="font-size: 14px; color: {{c.muted}}">指定しない</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; background: transparent; border: 0; border-bottom: 1px solid {{c.line}}; font: inherit; color: {{c.ink}}"><span style="flex-grow: 1; text-align: left; font-size: 15px">議事録テンプレート</span><span style="font-size: 14px; color: {{c.muted}}">[既定]</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid {{c.line}}"><span style="flex-grow: 1; font-size: 15px">AI要約を自動作成</span><button type="button" role="switch" aria-checked="true" aria-label="AI要約を自動作成" style="width: 48px; height: 28px; padding: 2px; display: flex; justify-content: flex-end; background: {{c.accent}}; border: 0; border-radius: 999px"><span style="width: 24px; height: 24px; background: {{c.knob}}; border-radius: 50%"></span></button></div>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; background: transparent; border: 0; font: inherit; color: {{c.ink}}"><span style="flex-grow: 1; text-align: left; font-size: 15px">詳細設定</span><span style="font-size: 14px; color: {{c.muted}}">AI・形式・背景・話者数</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
</div>
<footer style="padding: 12px 20px 34px; border-top: 1px solid {{c.line}}"><button type="submit" style="width: 100%; height: 50px; background: {{c.primary}}; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 500; color: {{c.onPrimary}}">作成してアップロード</button></footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var dark = !!this.props.dark;
var L = { scrim: '#8A8A90', bg: '#FAFAFA', surface: '#FFFFFF', sub: '#F4F4F5', line: '#E4E4E7', line2: '#D4D4D8', ink: '#09090B', muted: '#6B6B73', primary: '#09090B', onPrimary: '#FFFFFF', accent: '#047857', knob: '#FFFFFF' };
var D = { scrim: '#000000', bg: '#09090B', surface: '#111113', sub: '#1C1C1F', line: '#27272A', line2: '#3F3F46', ink: '#FAFAFA', muted: '#A1A1AA', primary: '#FAFAFA', onPrimary: '#09090B', accent: '#6EE7B7', knob: '#09090B' };
return { c: dark ? D : L };
}
}
</script>
</body>
</html>
